name: Release

# Publishes on version tags (v0.1.0, v0.2.0, ...) via npm trusted
# publishing (OIDC) — no NPM_TOKEN secret is used or needed.
#
# One-time prerequisites per package (after its first manual publish):
#   npmjs.com package -> Settings -> Trusted Publisher -> GitHub Actions,
#   repository Kundara/AgentsOfficeTower, workflow release.yml.
#
# The first-ever publish of a brand-new package cannot use OIDC
# (npm requires the package to exist first) and is done locally with
# a 2FA-enabled account.
#
# Publish order matters: core -> web -> cli (dependents last).

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing (needs >= 11.5.1)
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Publish @agents-tower/core
        run: .github/scripts/publish-if-new.sh packages/core
      - name: Publish @agents-tower/web
        run: .github/scripts/publish-if-new.sh packages/web
      - name: Publish agents-office-tower (CLI)
        run: .github/scripts/publish-if-new.sh packages/cli
