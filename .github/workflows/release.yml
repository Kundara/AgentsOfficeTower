name: Release

# Publishes on version tags (v0.1.0, v0.2.0, ...).
# Prerequisites (one-time, manual):
#   1. Create the `agents-tower` org on npmjs.com.
#   2. Add an npm automation token as the NPM_TOKEN repository secret.
# Publish order matters: core -> web -> cli (dependents last).

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Publish @agents-tower/core
        run: npm publish --workspace packages/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @agents-tower/web
        run: npm publish --workspace packages/web --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish agents-office-tower (CLI)
        run: npm publish --workspace packages/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
